<svg width="512" height="512" viewBox="0 0 512 512" fill="#0D1B2A" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B263B;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB74D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Solid background -->
  <rect width="512" height="512" fill="#0D1B2A"/>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#backgroundGradient)" filter="url(#shadow)"/>
  
  <!-- Inner background circle for depth -->
  <circle cx="256" cy="256" r="200" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Main wallet/card icon -->
  <g transform="translate(256, 256)">
    <!-- Wallet base -->
    <rect x="-60" y="-30" width="120" height="80" rx="12" ry="12" fill="url(#primaryGradient)" filter="url(#glow)"/>
    
    <!-- Wallet highlight -->
    <rect x="-55" y="-25" width="110" height="70" rx="8" ry="8" fill="rgba(255,255,255,0.2)"/>
    
    <!-- Card inside wallet -->
    <rect x="-50" y="-20" width="100" height="60" rx="6" ry="6" fill="url(#accentGradient)"/>
    
    <!-- Card details -->
    <rect x="-45" y="-15" width="90" height="4" rx="2" ry="2" fill="rgba(255,255,255,0.8)"/>
    <rect x="-45" y="-8" width="60" height="3" rx="1.5" ry="1.5" fill="rgba(255,255,255,0.6)"/>
    <rect x="-45" y="-2" width="40" height="3" rx="1.5" ry="1.5" fill="rgba(255,255,255,0.6)"/>
    
    <!-- Dollar sign on card -->
    <text x="25" y="15" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="rgba(255,255,255,0.9)">$</text>
    
    <!-- Wallet fold -->
    <path d="M -60 -30 Q -60 -40 -50 -40 L 50 -40 Q 60 -40 60 -30" fill="rgba(0,0,0,0.2)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </g>
  
  <!-- Decorative elements -->
  <!-- Top right accent -->
  <circle cx="350" cy="150" r="20" fill="url(#accentGradient)" opacity="0.6" filter="url(#glow)"/>
  <circle cx="350" cy="150" r="12" fill="rgba(255,255,255,0.3)"/>
  
  <!-- Bottom left accent -->
  <circle cx="150" cy="380" r="16" fill="url(#primaryGradient)" opacity="0.4" filter="url(#glow)"/>
  <circle cx="150" cy="380" r="8" fill="rgba(255,255,255,0.2)"/>
  
  <!-- Money symbol accent -->
  <g transform="translate(200, 100)">
    <circle cx="0" cy="0" r="25" fill="rgba(33,150,243,0.1)" stroke="rgba(33,150,243,0.3)" stroke-width="2"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2196F3" text-anchor="middle">₿</text>
  </g>
  
  <!-- Chart/graph accent -->
  <g transform="translate(320, 350)">
    <rect x="0" y="0" width="4" height="20" fill="url(#primaryGradient)" opacity="0.8"/>
    <rect x="8" y="8" width="4" height="12" fill="url(#primaryGradient)" opacity="0.6"/>
    <rect x="16" y="4" width="4" height="16" fill="url(#primaryGradient)" opacity="0.7"/>
    <rect x="24" y="12" width="4" height="8" fill="url(#primaryGradient)" opacity="0.5"/>
  </g>
</svg>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#263238;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="walletGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dollarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB74D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="512" cy="512" r="512" fill="url(#backgroundGradient)"/>
  
  <!-- Inner Circle for Depth -->
  <circle cx="512" cy="512" r="480" fill="none" stroke="rgba(76, 175, 80, 0.2)" stroke-width="2"/>
  
  <!-- Main Wallet Icon -->
  <g transform="translate(512, 512)">
    <!-- Wallet Body -->
    <rect x="-120" y="-60" width="240" height="120" rx="20" ry="20" fill="url(#walletGradient)" filter="url(#shadow)"/>
    
    <!-- Wallet Inner Shadow -->
    <rect x="-110" y="-50" width="220" height="100" rx="15" ry="15" fill="none" stroke="rgba(0, 0, 0, 0.2)" stroke-width="2"/>
    
    <!-- Wallet Fold -->
    <path d="M -120 -60 Q -120 -80 0 -80 Q 120 -80 120 -60 L 120 -40 Q 120 -20 0 -20 Q -120 -20 -120 -40 Z" fill="url(#walletGradient)" opacity="0.8"/>
    
    <!-- Wallet Strap -->
    <rect x="-100" y="-70" width="200" height="20" rx="10" ry="10" fill="url(#walletGradient)" opacity="0.9"/>
    
    <!-- Money Coins -->
    <g transform="translate(-60, 0)">
      <!-- Large Coin -->
      <circle cx="0" cy="0" r="25" fill="url(#coinGradient)" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2"/>
      <!-- Dollar Sign on Coin -->
      <text x="0" y="8" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">$</text>
    </g>
    
    <g transform="translate(60, 0)">
      <!-- Medium Coin -->
      <circle cx="0" cy="0" r="20" fill="url(#coinGradient)" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="16" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5"/>
      <!-- Dollar Sign on Coin -->
      <text x="0" y="6" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">$</text>
    </g>
    
    <!-- Small Coins Scattered -->
    <g transform="translate(-30, 30)">
      <circle cx="0" cy="0" r="12" fill="url(#dollarGradient)" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="9" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">$</text>
    </g>
    
    <g transform="translate(30, 30)">
      <circle cx="0" cy="0" r="12" fill="url(#dollarGradient)" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="9" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">$</text>
    </g>
    
    <!-- Chart/Graph Elements -->
    <g transform="translate(0, -120)">
      <!-- Mini Chart -->
      <rect x="-40" y="-20" width="80" height="40" rx="8" ry="8" fill="rgba(76, 175, 80, 0.2)" stroke="rgba(76, 175, 80, 0.5)" stroke-width="1"/>
      
      <!-- Chart Bars -->
      <rect x="-30" y="-5" width="8" height="15" fill="url(#walletGradient)"/>
      <rect x="-15" y="-10" width="8" height="20" fill="url(#walletGradient)"/>
      <rect x="0" y="-15" width="8" height="25" fill="url(#walletGradient)"/>
      <rect x="15" y="-8" width="8" height="18" fill="url(#walletGradient)"/>
      <rect x="30" y="-12" width="8" height="22" fill="url(#walletGradient)"/>
    </g>
  </g>
  
  <!-- Decorative Elements -->
  <!-- Top Right Corner Accent -->
  <circle cx="800" cy="200" r="60" fill="rgba(76, 175, 80, 0.1)"/>
  <circle cx="800" cy="200" r="40" fill="rgba(76, 175, 80, 0.2)"/>
  
  <!-- Bottom Left Corner Accent -->
  <circle cx="200" cy="800" r="50" fill="rgba(255, 152, 0, 0.1)"/>
  <circle cx="200" cy="800" r="30" fill="rgba(255, 152, 0, 0.2)"/>
  
  <!-- Subtle Pattern Overlay -->
  <defs>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="rgba(76, 175, 80, 0.1)"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" fill="url(#dots)" opacity="0.3"/>
</svg>

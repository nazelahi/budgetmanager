<svg width="512" height="512" viewBox="0 0 512 512" fill="#0D1B2A" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid background -->
  <rect width="512" height="512" fill="#0D1B2A"/>
  
  <!-- Foreground content for adaptive icon -->
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB74D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main wallet/card icon centered -->
  <g transform="translate(256, 256)">
    <!-- Wallet base -->
    <rect x="-70" y="-35" width="140" height="90" rx="15" ry="15" fill="url(#primaryGradient)" filter="url(#glow)"/>
    
    <!-- Wallet highlight -->
    <rect x="-65" y="-30" width="130" height="80" rx="10" ry="10" fill="rgba(255,255,255,0.2)"/>
    
    <!-- Card inside wallet -->
    <rect x="-60" y="-25" width="120" height="70" rx="8" ry="8" fill="url(#accentGradient)"/>
    
    <!-- Card details -->
    <rect x="-55" y="-20" width="110" height="5" rx="2.5" ry="2.5" fill="rgba(255,255,255,0.8)"/>
    <rect x="-55" y="-12" width="70" height="4" rx="2" ry="2" fill="rgba(255,255,255,0.6)"/>
    <rect x="-55" y="-5" width="50" height="4" rx="2" ry="2" fill="rgba(255,255,255,0.6)"/>
    
    <!-- Dollar sign on card -->
    <text x="30" y="18" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="rgba(255,255,255,0.9)">$</text>
    
    <!-- Wallet fold -->
    <path d="M -70 -35 Q -70 -45 -60 -45 L 60 -45 Q 70 -45 70 -35" fill="rgba(0,0,0,0.2)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </g>
  
  <!-- Decorative money symbol -->
  <g transform="translate(180, 120)">
    <circle cx="0" cy="0" r="30" fill="rgba(33,150,243,0.1)" stroke="rgba(33,150,243,0.3)" stroke-width="2"/>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2196F3" text-anchor="middle">₿</text>
  </g>
  
  <!-- Chart accent -->
  <g transform="translate(340, 140)">
    <rect x="0" y="0" width="5" height="25" fill="url(#primaryGradient)" opacity="0.8"/>
    <rect x="10" y="10" width="5" height="15" fill="url(#primaryGradient)" opacity="0.6"/>
    <rect x="20" y="5" width="5" height="20" fill="url(#primaryGradient)" opacity="0.7"/>
    <rect x="30" y="15" width="5" height="10" fill="url(#primaryGradient)" opacity="0.5"/>
  </g>
</svg>
